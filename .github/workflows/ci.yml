name: smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r skills/business-lead-intelligence/requirements.txt
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
      - name: Check dependency bootstrap plan
        run: python skills/business-lead-intelligence/scripts/bootstrap.py --dry-run --no-venv --no-optional --no-browser-control
      - name: Setup check
        run: python skills/business-lead-intelligence/scripts/doctor.py --allow-no-driver
